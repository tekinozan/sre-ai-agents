# Kubernetes expert.

name: kubernetes-expert
version: v1
enabled: true

prompt_ref: kubernetes_expert.investigate:v1
model_profile: analytical:v1

capabilities:
  - kubernetes
  - scheduling
  - resource-limits
  - probes

incident_types:
  - kubernetes
  - availability
  - resource-exhaustion
  - deployment

tools:
  allow:
    - kubernetes.pods
    - kubernetes.events
    - prometheus.query
    - prometheus.query_range

execution:
  max_iterations: 4
  timeout_seconds: 75
  max_tool_calls: 6
  max_llm_calls: 5
  max_total_tokens: 90000
  max_estimated_cost: 0.50

output_schema: AgentFinding
