apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-ai-agent-api
  labels:
    app.kubernetes.io/name: sre-ai-api
    app.kubernetes.io/part-of: sre-ai-agent
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-ai-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-ai-api
        app.kubernetes.io/part-of: sre-ai-agent
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
      annotations:
        checksum/config: c624b9cf51eb31e512f9e14052835d7fe5e0771b9a9f658d94c9a1b9892f92bf
    spec:
      serviceAccountName: sre-ai-agent-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "sre-ai-agent/api:1.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sre-ai-agent
            - secretRef:
                name: sre-ai-agent-development
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: Telemetry__ServiceName
              value: sre-ai-api
            - name: Kafka__SaslUsername
              valueFrom:
                secretKeyRef:
                  name: sre-ai-agent-development
                  key: Kafka__SaslUsername
                  optional: true
            - name: Kafka__SaslPassword
              valueFrom:
                secretKeyRef:
                  name: sre-ai-agent-development
                  key: Kafka__SaslPassword
                  optional: true
            
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 30

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            
      volumes:
        - name: tmp
          emptyDir: {}
        
      terminationGracePeriodSeconds: 60
---
