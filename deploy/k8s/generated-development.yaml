apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sre-ai-agent-investigation-worker
  labels:
    app.kubernetes.io/name: sre-ai-investigation-worker
    app.kubernetes.io/part-of: sre-ai-agent
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    sre-ai-agent.io/scaling-note: >-
      CPU is a floor, not the right signal. An agent waiting on a model call is
      idle by every CPU measure while the backlog grows; replace this with
      sre_kafka_consumer_lag once a metrics adapter is installed.
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sre-ai-agent-investigation-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
