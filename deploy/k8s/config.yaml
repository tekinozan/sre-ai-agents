# Non-secret configuration. Everything here is safe to read in a code review,
# which is the line section 13 draws between this and the Secret below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-ai-agent
  namespace: sre-ai-agent
data:
  Kafka__ConsumerGroup: sre-ai-agent
  Kafka__MaxInFlightMessages: "100"
  Kafka__MaxDeliveryAttempts: "5"

  Registries__ConfigurationRoot: /app/config
  Registries__PromptRoot: /app/prompts

  # Pinned releases, never "latest".
  #
  # These identify the exact prompts and model profiles an investigation ran on,
  # so a report months old stays explicable and a regression stays attributable
  # (ARCHITECTURE.md 8.2). Promoting a release is an edit here and a rollout,
  # which is what makes it reviewable.
  Registries__AgentRelease: agents-2026.08.25.1
  Registries__PromptRelease: sre-prompts-2026.08.25.1
  Registries__ModelRelease: models-2026.08.25.1
  Registries__ToolRelease: tools-2026.08.25.1
  Registries__PolicyRelease: policies-2026.08.25.1
  Registries__FlagRelease: flags-2026.08.25.1

  Llm__Provider: scripted
  # A rendered prompt contains the retrieved evidence and is the richest source
  # of sensitive data in the system. This stays false outside a deliberate
  # investigation of the platform itself.
  Llm__LogRenderedPrompts: "false"

  Observability__UseFakeProviders: "true"

  Telemetry__OtlpEndpoint: http://otel-collector.observability:4317
  # Investigations are sampled in full regardless of this; it applies to HTTP
  # ingress, which is mostly probes.
  Telemetry__HttpSamplingRatio: "0.1"
  Telemetry__EnablePrometheusEndpoint: "true"

  Workflow__Engine: temporal
  Workflow__TemporalHostPort: temporal-frontend.temporal:7233
  Workflow__TemporalNamespace: sre-ai-agent
  Workflow__TaskQueue: sre-investigation
  Workflow__DeadlineSeconds: "600"

  # Off in production. Replicas racing for the migration lock during a rolling
  # update is a deployment failure that looks like a flake, so schema changes are
  # a separate reviewable step.
  Database__MigrateOnStartup: "false"

  Security__AllowDevelopmentAuthentication: "false"
  Security__RateLimitPerMinute: "600"
---
# Referenced, not created.
#
# A secret committed to a repository is a secret that has leaked. Create this out
# of band or have an External Secrets operator populate it from the managed store
# section 13 asks for; the manifests only name the keys they read.
#
#   kubectl create secret generic sre-ai-agent \
#     --namespace sre-ai-agent \
#     --from-literal=Database__ConnectionString='...' \
#     --from-literal=Kafka__BootstrapServers='...' \
#     --from-literal=Security__Authority='https://...' \
#     --from-literal=Security__Audience='sre-ai-agent'
apiVersion: v1
kind: Secret
metadata:
  name: sre-ai-agent
  namespace: sre-ai-agent
  annotations:
    sre-ai-agent.io/managed-externally: "true"
type: Opaque
stringData:
  Database__ConnectionString: "REPLACE_ME"
  Kafka__BootstrapServers: "REPLACE_ME"
  Security__Authority: "REPLACE_ME"
  Security__Audience: "REPLACE_ME"
