# The two worker deployments (ARCHITECTURE.md 19.1).
#
# They exist separately from the API and from each other because they fail
# differently. A webhook storm should not compete with an operator reading a
# report, and an LLM fan-out should not compete with either.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-ai-alert-worker
  namespace: sre-ai-agent
  labels:
    app.kubernetes.io/name: sre-ai-alert-worker
    app.kubernetes.io/part-of: sre-ai-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-ai-alert-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-ai-alert-worker
        app.kubernetes.io/part-of: sre-ai-agent
    spec:
      serviceAccountName: sre-ai-alert-worker
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-worker
          image: sre-ai-agent/alert-worker:1.0.0
          envFrom:
            - configMapRef:
                name: sre-ai-agent
            - secretRef:
                name: sre-ai-agent
          env:
            - name: Telemetry__ServiceName
              value: sre-ai-alert-worker
            - name: Kafka__ConsumerGroup
              value: sre-ai-agent-alert-worker
            # This host runs no workflow engine at all. Pinning the value stops a
            # misread of the shared ConfigMap making it try to reach Temporal.
            - name: Workflow__Engine
              value: inline
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

      # Long enough for an in-flight message to reach a safe point and commit its
      # offset. Cutting it short means redelivery, which is safe but wasteful on
      # every rolling update (ARCHITECTURE.md 19.2).
      terminationGracePeriodSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-ai-investigation-worker
  namespace: sre-ai-agent
  labels:
    app.kubernetes.io/name: sre-ai-investigation-worker
    app.kubernetes.io/part-of: sre-ai-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-ai-investigation-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-ai-investigation-worker
        app.kubernetes.io/part-of: sre-ai-agent
    spec:
      serviceAccountName: sre-ai-investigation-worker
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: investigation-worker
          image: sre-ai-agent/investigation-worker:1.0.0
          envFrom:
            - configMapRef:
                name: sre-ai-agent
            - secretRef:
                name: sre-ai-agent
          env:
            - name: Telemetry__ServiceName
              value: sre-ai-investigation-worker
            - name: Kafka__ConsumerGroup
              value: sre-ai-agent-investigation-worker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

      # Longer than the alert worker's. An activity can be mid-model call, and
      # cutting it off loses the tokens already paid for along with the evidence
      # gathered so far. Temporal would resume the workflow, but the work is
      # repeated rather than continued.
      terminationGracePeriodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sre-ai-investigation-worker
  namespace: sre-ai-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-ai-investigation-worker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sre-ai-investigation-worker
  namespace: sre-ai-agent
  annotations:
    # Consumer lag is the real signal and it needs a metrics adapter this
    # manifest cannot assume exists. Section 19.2 asks for lag, queue depth or
    # in-flight investigations rather than CPU, because an agent waiting on a
    # model call is idle by every CPU measure while the backlog grows. CPU is
    # kept only as a floor so the deployment still scales without the adapter.
    sre-ai-agent.io/scaling-note: >-
      Replace the CPU metric with sre_kafka_consumer_lag once a metrics adapter
      is installed. CPU alone will not scale this workload correctly.
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sre-ai-investigation-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Slow to scale down. A pod removed mid-investigation forces Temporal to
      # replay that investigation on another replica, which costs the model calls
      # again.
      stabilizationWindowSeconds: 300
