# Default-deny, then the egress each host actually needs.
#
# The platform's job is to query production systems on an agent's behalf, which
# makes its egress the interesting attack surface: a prompt injection that
# convinces an agent to exfiltrate evidence needs somewhere to send it. The tool
# allowlist and the policy engine are the primary defences; this is the one that
# does not depend on any of them being correct.
#
# CIDRs below are placeholders. They have to name the real backends, because a
# policy that allows 0.0.0.0/0 is a policy that allows anything.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: sre-ai-agent
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sre-ai-api
  namespace: sre-ai-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sre-ai-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Scraping is allowed from the monitoring namespace only. The endpoint
    # exposes counters rather than incident content, but it is still not
    # something to leave open to the cluster.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 7233
        - protocol: TCP
          port: 4317
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sre-ai-alert-worker
  namespace: sre-ai-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sre-ai-alert-worker
  policyTypes: [Ingress, Egress]
  # No ingress at all. It consumes from a topic; nothing calls it.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 4317
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sre-ai-investigation-worker
  namespace: sre-ai-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sre-ai-investigation-worker
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 7233
        - protocol: TCP
          port: 4317
        # The observability backends the read-only tools query.
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 3100
    # The Kubernetes API, for the pods and events tools. Reached through the
    # in-cluster service address rather than a public endpoint.
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
