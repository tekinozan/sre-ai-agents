# Local development stack (ARCHITECTURE.md 19.3).
#
# Everything here is disposable and self-contained. Nothing reaches a real
# observability backend: the tool adapters are the deterministic fakes, so an
# investigation run on a laptop cannot query a production metrics store by
# accident.
#
#   docker compose -f deploy/docker/compose.yaml up -d --build

name: sre-ai-agent

x-platform-image: &platform-image
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile

x-platform-env: &platform-env
  DOTNET_ENVIRONMENT: Development
  ASPNETCORE_ENVIRONMENT: Development
  Database__ConnectionString: Host=postgres;Database=sre;Username=${POSTGRES_BUSINESS_USER:-businessowner};Password=${POSTGRES_BUSINESS_PASSWORD:-businessowner}
  Kafka__BootstrapServers: redpanda:9092
  Registries__ConfigurationRoot: /app/config
  Registries__PromptRoot: /app/prompts
  # The local stack stays on the fakes: they produce one coherent incident, and
  # the vertical slice is deterministic because of it. Real backends come from
  # the compose.observability.yaml overlay.
  Observability__MetricsProvider: "fake"
  Observability__LogProvider: "fake"
  Observability__KubernetesProvider: "fake"
  Telemetry__OtlpEndpoint: http://otel-collector:4317
  # Every trace is kept locally. The ratio exists to protect a production
  # tracing backend from ingress volume, and there is none of either here; what
  # a developer wants is the whole path from the webhook to the report.
  Telemetry__HttpSamplingRatio: "1.0"
  Workflow__Engine: temporal
  Workflow__TemporalHostPort: temporal:7233
  Llm__Bootstrap__Tenant: local
  Llm__Bootstrap__AdapterKind: Scripted
  Llm__Bootstrap__Endpoint: https://scripted.invalid/
  Llm__Bootstrap__CredentialRef: env://SRE_SCRIPTED_CREDENTIAL

services:
  postgres:
    image: postgres:17-alpine
    environment:
      # This administrator only bootstraps a fresh volume. Runtime owners are
      # created by postgres-provision and existing roles are never modified.
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-sre_admin}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-sre_admin}
      POSTGRES_DB: postgres
    ports: ["${SRE_BIND_ADDRESS:-127.0.0.1}:${SRE_POSTGRES_PORT:-55432}:5432"]
    healthcheck:
      # TCP avoids a false healthy signal while local-socket init still runs.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # The image only runs init hooks for a new volume. This explicit job also
  # provisions retained legacy volumes additively, without resetting roles.
  postgres-provision:
    image: postgres:17-alpine
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      POSTGRES_BOOTSTRAP_USER: ${POSTGRES_BOOTSTRAP_USER:-sre_admin}
      POSTGRES_BOOTSTRAP_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-sre_admin}
      POSTGRES_LEGACY_ADMIN_USER: ${POSTGRES_LEGACY_ADMIN_USER:-sre}
      POSTGRES_LEGACY_ADMIN_PASSWORD: ${POSTGRES_LEGACY_ADMIN_PASSWORD:-sre}
      POSTGRES_BUSINESS_USER: ${POSTGRES_BUSINESS_USER:-businessowner}
      POSTGRES_BUSINESS_PASSWORD: ${POSTGRES_BUSINESS_PASSWORD:-businessowner}
      POSTGRES_TEMPORAL_USER: ${POSTGRES_TEMPORAL_USER:-temporal}
      POSTGRES_TEMPORAL_PASSWORD: ${POSTGRES_TEMPORAL_PASSWORD:-temporal}
    entrypoint: ["/bin/sh", "/usr/local/bin/provision-postgres.sh"]
    volumes:
      - ./provision-postgres.sh:/usr/local/bin/provision-postgres.sh:ro

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${SRE_KAFKA_PORT:-19092}
    ports: ["${SRE_BIND_ADDRESS:-127.0.0.1}:${SRE_KAFKA_PORT:-19092}:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X brokers=localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Topics are created explicitly rather than left to auto-creation. A topic
  # that appears on first use gets one partition and the broker's defaults,
  # which is not what a partition-ordered incident stream wants.
  topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rpk topic create -X brokers=redpanda:9092 -p 3
        sre.alert.received.v1
        sre.incident.created.v1
        sre.incident.investigation.requested.v1
        sre.incident.updated.v1
        sre.incident.completed.v1
        sre.remediation.requested.v1
        sre.remediation.completed.v1
        sre.deadletter.v1 || true
    restart: "no"

  # The workflow engine keeps its own store, separate from the business one
  # (ARCHITECTURE.md 9.2). Business state has to be readable without replaying a
  # workflow, and workflow history has to be prunable without touching incidents.
  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres-provision: {condition: service_completed_successfully}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_TEMPORAL_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_TEMPORAL_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # Database creation is safe and idempotent in postgres-provision; the
      # official auto-setup image still applies Temporal's schema migrations.
      SKIP_DB_CREATE: "true"
    ports: ["${SRE_BIND_ADDRESS:-127.0.0.1}:${SRE_TEMPORAL_PORT:-7233}:7233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${SRE_TEMPORAL_UI_PORT:-8088}
    ports: ["${SRE_BIND_ADDRESS:-127.0.0.1}:${SRE_TEMPORAL_UI_PORT:-8088}:8080"]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${SRE_BIND_ADDRESS:-127.0.0.1}:${SRE_JAEGER_PORT:-16686}:16686"

  # The collector sits between the services and the backends so a host has one
  # export target rather than one per signal. Swapping Jaeger for something else
  # is then a change here instead of in three deployments.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/config.yaml"]
    depends_on: [jaeger]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${SRE_BIND_ADDRESS:-127.0.0.1}:${SRE_OTEL_PORT:-4317}:4317"

  migrate:
    <<: *platform-image
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: SreAiAgent.Api
    depends_on:
      postgres-provision: {condition: service_completed_successfully}
    environment:
      <<: *platform-env
      Database__MigrateOnStartup: "false"
    entrypoint: ["dotnet", "/app/migrator/SreAiAgent.DatabaseMigrator.dll"]
    restart: on-failure

  api:
    <<: *platform-image
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: SreAiAgent.Api
    depends_on:
      migrate: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}
      temporal: {condition: service_healthy}
    environment:
      <<: *platform-env
      Telemetry__ServiceName: sre-ai-api
      Security__AllowDevelopmentAuthentication: "true"
      # The one-shot migration job owns the schema. Runtime hosts must never
      # race it during startup.
      Database__MigrateOnStartup: "false"
    ports: ["${SRE_BIND_ADDRESS:-127.0.0.1}:${SRE_API_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  alert-worker:
    <<: *platform-image
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: SreAiAgent.AlertWorker
    depends_on:
      api: {condition: service_healthy}
    environment:
      <<: *platform-env
      Telemetry__ServiceName: sre-ai-alert-worker
      Kafka__ConsumerGroup: sre-ai-agent-alert-worker
      # The alert worker hosts no workflow engine at all, so the setting is
      # irrelevant to it; it is pinned to inline so a misread of the shared
      # environment cannot make it try to reach Temporal.
      Workflow__Engine: inline
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  investigation-worker:
    <<: *platform-image
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: SreAiAgent.InvestigationWorker
    depends_on:
      api: {condition: service_healthy}
    environment:
      <<: *platform-env
      Telemetry__ServiceName: sre-ai-investigation-worker
      Kafka__ConsumerGroup: sre-ai-agent-investigation-worker
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
