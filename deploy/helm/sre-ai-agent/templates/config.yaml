{{/*
Non-secret configuration only. Everything here is readable in a code review,
which is the line ARCHITECTURE.md 13 draws between this and the Secret the
deployments also mount.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "sre.labels" (dict "name" "sre-ai-agent" "root" .) | nindent 4 }}
data:
  Registries__ConfigurationRoot: /app/config
  Registries__PromptRoot: /app/prompts

  {{- /* Pinned releases, never "latest": a report months old has to stay explicable. */}}
  Registries__AgentRelease: {{ .Values.releases.agent | quote }}
  Registries__PromptRelease: {{ .Values.releases.prompt | quote }}
  Registries__ModelRelease: {{ .Values.releases.model | quote }}
  Registries__ToolRelease: {{ .Values.releases.tool | quote }}
  Registries__PolicyRelease: {{ .Values.releases.policy | quote }}
  Registries__FlagRelease: {{ .Values.releases.flag | quote }}

  Llm__Provider: {{ .Values.llm.provider | quote }}
  Llm__LogRenderedPrompts: "false"

  {{- with .Values.llm.bootstrap }}
  {{- /* Seeds the initial ProviderConnectionRevision at first boot
         (ModelAssignmentBootstrapper), a no-op once one already exists for the
         tenant. The credential itself never appears here — only the env://
         pointer the deployment resolves via a secretKeyRef (sre.llmCredentialEnv
         in _helpers.tpl). */}}
  Llm__Bootstrap__Tenant: {{ .tenant | default "default" | quote }}
  Llm__Bootstrap__ConnectionDisplayName: {{ .connectionDisplayName | default "production" | quote }}
  Llm__Bootstrap__AdapterKind: {{ .adapterKind | quote }}
  Llm__Bootstrap__Endpoint: {{ .endpoint | quote }}
  Llm__Bootstrap__CredentialRef: "env://SRE_LLM_CREDENTIAL"
  {{- with .organization }}
  Llm__Bootstrap__Organization: {{ . | quote }}
  {{- end }}
  {{- with .assignmentName }}
  Llm__Bootstrap__AssignmentName: {{ . | quote }}
  {{- end }}
  {{- with .classifierProfile }}
  Llm__Bootstrap__ClassifierProfile: {{ . | quote }}
  {{- end }}
  {{- with .correlatorProfile }}
  Llm__Bootstrap__CorrelatorProfile: {{ . | quote }}
  {{- end }}
  {{- end }}

  Kafka__SecurityProtocol: {{ .Values.kafka.securityProtocol | quote }}
  {{- with .Values.kafka.saslMechanism }}
  Kafka__SaslMechanism: {{ . | quote }}
  {{- end }}
  {{- with .Values.kafka.caSecret }}
  Kafka__SslCaLocation: "/etc/sre-ai-agent/kafka-ca/{{ $.Values.kafka.caSecretKey }}"
  {{- end }}

  Retention__Enabled: {{ .Values.retention.enabled | quote }}

  Observability__MetricsProvider: {{ .Values.observability.metricsProvider | quote }}
  Observability__LogProvider: {{ .Values.observability.logProvider | quote }}
  Observability__KubernetesProvider: {{ .Values.observability.kubernetesProvider | quote }}
  {{- with .Values.observability.prometheusBaseAddress }}
  Observability__PrometheusBaseAddress: {{ . | quote }}
  {{- end }}
  {{- with .Values.observability.logBackendBaseAddress }}
  Observability__LogBackendBaseAddress: {{ . | quote }}
  {{- end }}
  {{- range $cluster, $namespace := .Values.observability.namespaceByCluster }}
  {{- if not (kindIs "string" $namespace) }}
  {{- fail (printf "observability.namespaceByCluster.%s must be one namespace string per cluster, not a list or mapping." $cluster) }}
  {{- end }}
  Observability__KubernetesNamespaceByCluster__{{ $cluster }}: {{ $namespace | quote }}
  {{- end }}

  Telemetry__OtlpEndpoint: {{ .Values.telemetry.otlpEndpoint | quote }}
  Telemetry__HttpSamplingRatio: {{ .Values.telemetry.httpSamplingRatio | quote }}
  Telemetry__EnablePrometheusEndpoint: "true"

  Workflow__Engine: {{ .Values.workflow.engine | quote }}
  Workflow__TemporalHostPort: {{ .Values.workflow.hostPort | quote }}
  Workflow__TemporalNamespace: {{ .Values.workflow.namespace | quote }}
  Workflow__TaskQueue: {{ .Values.workflow.taskQueue | quote }}
  Workflow__DeadlineSeconds: {{ .Values.workflow.deadlineSeconds | quote }}

  {{- /* Off in production: replicas racing for the migration lock is a
         deployment failure that looks like a flake. */}}
  Database__MigrateOnStartup: "false"

  Security__AllowDevelopmentAuthentication: "false"
