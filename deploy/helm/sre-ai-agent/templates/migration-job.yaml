{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-database-migration
  labels: {{- include "sre.labels" (dict "name" "sre-ai-migrator" "root" .) | nindent 4 }}
  annotations:
    sre-ai-agent.io/promotion-gate: "application workloads require this Job to succeed first"
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {{- include "sre.labels" (dict "name" "sre-ai-migrator" "root" .) | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{- include "sre.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrator
          image: {{ include "sre.image" (dict "component" "api" "root" .) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["dotnet", "/app/migrator/SreAiAgent.DatabaseMigrator.dll"]
          env:
            - name: Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ include "sre.migrationSecretName" . }}
                  key: {{ .Values.migration.databaseConnectionStringKey }}
          securityContext: {{- include "sre.containerSecurityContext" . | nindent 12 }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}