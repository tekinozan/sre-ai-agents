apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "sre.labels" (dict "name" "sre-ai-api" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-ai-api
  template:
    metadata:
      labels: {{- include "sre.labels" (dict "name" "sre-ai-api" "root" .) | nindent 8 }}
      annotations:
        {{- /* Rolls the pods when configuration changes. Without this a release
               that only edits the ConfigMap leaves every pod running the old
               values, and the deployment reports success. */}}
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      securityContext: {{- include "sre.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "sre.image" (dict "component" "api" "root" .) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: Telemetry__ServiceName
              value: sre-ai-api
          securityContext: {{- include "sre.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}

          {{- /* Liveness never touches the database: a probe that did would
                 restart every pod during a failover and turn a recoverable
                 dependency outage into a full one. Readiness does, because a pod
                 that cannot reach PostgreSQL can accept an alert and lose it. */}}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 30

          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "sre.labels" (dict "name" "sre-ai-api" "root" .) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: sre-ai-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "sre.labels" (dict "name" "sre-ai-api" "root" .) | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-ai-api
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "sre.labels" (dict "name" "sre-ai-api" "root" .) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCpu }}
{{- end }}
