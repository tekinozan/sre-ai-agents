# The worker that queries the Kubernetes API is the only workload with a token.
# Keeping each workload identity separate makes later permission changes narrow.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sre.serviceAccountName" (dict "component" "api" "Release" .Release) }}
  labels: {{- include "sre.labels" (dict "name" "sre-ai-api" "root" .) | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sre.serviceAccountName" (dict "component" "alert-worker" "Release" .Release) }}
  labels: {{- include "sre.labels" (dict "name" "sre-ai-alert-worker" "root" .) | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sre.serviceAccountName" (dict "component" "investigation-worker" "Release" .Release) }}
  labels: {{- include "sre.labels" (dict "name" "sre-ai-investigation-worker" "root" .) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-observer
  namespace: {{ include "sre.observedNamespace" . }}
  labels: {{- include "sre.labels" (dict "name" "sre-ai-observer" "root" .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-observer
  namespace: {{ include "sre.observedNamespace" . }}
  labels: {{- include "sre.labels" (dict "name" "sre-ai-observer" "root" .) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-observer
subjects:
  - kind: ServiceAccount
    name: {{ include "sre.serviceAccountName" (dict "component" "investigation-worker" "Release" .Release) }}
    namespace: {{ .Release.Namespace }}