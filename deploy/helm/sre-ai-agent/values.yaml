# Defaults suitable for a non-production cluster.
#
# Anything that must differ in production is either empty here or annotated. A
# chart whose defaults happen to be production-safe teaches people not to read
# the values, and the first time that is wrong it is wrong silently.

image:
  registry: sre-ai-agent
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Chart defaults target a shared development namespace. Production overrides
# this to Production while keeping development authentication disabled: shared
# environments always exercise the real issuer rather than a local bypass.
environment: Development

namespace:
  # Production namespaces are normally provisioned separately. The generated
  # shared-development manifest opts in so it remains self-contained.
  create: false

app:
  # The migration pipeline first renders only the ConfigMap, identities and Job
  # with this false. It promotes the workloads only after that Job succeeds.
  enabled: true

# Referenced, never created by the chart. Section 13 keeps production secrets in
# a managed store; the chart only names the Secret it reads.
existingSecret: sre-ai-agent

migration:
  # An explicit, separately authorized Job. Application pods never migrate on
  # startup, and this Job is not a Helm hook so it can rely on ordinary release
  # resources being present.
  enabled: false
  secretName: ""
  databaseConnectionStringKey: Database__ConnectionString
  backoffLimit: 0

releases:
  agent: agents-2026.08.25.1
  prompt: sre-prompts-2026.08.25.1
  model: models-2026.08.25.1
  tool: tools-2026.08.25.1
  policy: policies-2026.08.25.1
  flag: flags-2026.08.25.1

telemetry:
  otlpEndpoint: http://otel-collector.observability:4317
  # Applies to HTTP ingress only. Investigations are always sampled in full.
  httpSamplingRatio: "0.1"

workflow:
  engine: temporal
  hostPort: temporal-frontend.temporal:7233
  namespace: sre-ai-agent
  taskQueue: sre-investigation
  deadlineSeconds: "600"

observability:
  # Selected per port. A fake provider is refused at startup in Production, so
  # these defaults are for non-production installs; a production values file sets
  # prometheus, loki and incluster.
  metricsProvider: fake
  logProvider: fake
  kubernetesProvider: fake

  # Required when kubernetesProvider is `incluster`: the namespaces this
  # deployment may read, keyed by cluster. An empty map is refused rather than
  # treated as permissive.
  namespaceByCluster: {}

  # Required when the matching provider is not `fake`.
  prometheusBaseAddress: ""
  logBackendBaseAddress: ""

llm:
  # Refused at startup in Production together with the fake observability
  # providers above; a production values file names a real one.
  provider: scripted

  # Seeds the initial ProviderConnectionRevision at first boot
  # (ModelAssignmentBootstrapper) when no active assignment exists yet for the
  # tenant; a no-op otherwise. Left empty here: a non-production install
  # provisions connections through the model control-plane API instead, and an
  # empty map renders no Llm__Bootstrap__* configuration at all.
  bootstrap: {}

kafka:
  # Plaintext is for the local compose stack this chart does not target; a
  # production values file sets SaslSsl with a mechanism.
  securityProtocol: Plaintext
  saslMechanism: ""

  # Kafka__SaslUsername / Kafka__SaslPassword secretKeyRefs: named keys read
  # individually from an externally managed Secret (existingSecret unless
  # secretName overrides it), never a literal credential.
  secretName: ""
  saslUsernameKey: Kafka__SaslUsername
  saslPasswordKey: Kafka__SaslPassword

  # Name of an existing Secret carrying a private CA bundle, mounted
  # read-only into every container that talks to Kafka. Empty means no volume
  # is mounted and the platform CA store is trusted instead. Only the
  # Secret's name and the key inside it are ever named here — never PEM
  # content.
  caSecret: ""
  caSecretKey: ca.crt

rbac:
  # The namespace whose read-only Kubernetes resources the investigation worker
  # may inspect. Empty means the Helm release namespace.
  observedNamespace: ""

networkPolicy:
  enabled: true
  # Replace with the CIDRs hosting this cluster's external PostgreSQL, Kafka,
  # Temporal, telemetry and observability endpoints. Never widen to 0.0.0.0/0.
  backendCidrs: ["10.0.0.0/8"]
  kubernetesApiCidr: "10.96.0.1/32"
  # Outbound CIDRs permitted for model provider HTTPS calls (port 443).
  # Base/development defaults to empty since the scripted provider makes no network calls.
  providerCidrs: []
retention:
  enabled: true

api:
  replicas: 2
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    # No CPU limit: throttling a latency-sensitive request host buys nothing the
    # request quota does not already give.
    limits: {memory: 512Mi}
  autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 10, targetCpu: 70}

alertWorker:
  replicas: 2
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {memory: 512Mi}

investigationWorker:
  replicas: 2
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {memory: 1Gi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    # CPU is a floor, not the right signal. An agent waiting on a model call is
    # idle by every CPU measure while the backlog grows, so replace this with
    # consumer lag once a metrics adapter exists (ARCHITECTURE.md 19.2).
    targetCpu: 70
