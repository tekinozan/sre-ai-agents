# Production overlay: `helm install ... -f values.yaml -f values.production.yaml`.
#
# Only what must differ from the dev-safe base is named here. Anything not
# listed keeps the base default, which is why `existingSecret`, `image.tag`
# and every resource/replica setting still come from values.yaml or an
# `--set` on the release itself.

environment: Production

migration:
  # Separate from existingSecret so the Job receives only its database
  # credential. Supply this externally managed Secret at release time.
  secretName: sre-ai-agent-production-migration

rbac:
  # Must equal observability.namespaceByCluster.production. The Role and
  # RoleBinding are emitted in this target namespace for the worker identity.
  observedNamespace: default

observability:
  metricsProvider: prometheus
  logProvider: loki
  kubernetesProvider: incluster
  # One exact namespace per logical cluster, never a list: KubernetesSelector
  # (ARCHITECTURE.md) deliberately permits a single allowed namespace per
  # cluster, matching a namespace-scoped service account. Choose the one
  # namespace this deployment's service account is actually authorized to
  # inspect; "default" is a placeholder, not a recommendation.
  namespaceByCluster:
    production: "default"
  prometheusBaseAddress: "http://prometheus.monitoring:9090/"
  logBackendBaseAddress: "http://loki.monitoring:3100/"

llm:
  provider: openai

  # Seeds the production ProviderConnectionRevision at first boot, once, for a
  # tenant with no active assignment yet. credentialSecretKey names the key an
  # operator populates in `existingSecret` with the real OpenAI API key — the
  # key itself, never the value, is the only thing named here.
  bootstrap:
    tenant: production
    connectionDisplayName: openai-production
    adapterKind: OpenAi
    endpoint: "https://api.openai.com/v1"
    credentialSecretKey: OpenAiApiKey
    assignmentName: production
    classifierProfile: fast
    correlatorProfile: analytical

kafka:
  securityProtocol: SaslSsl
  saslMechanism: ScramSha512
  # A private CA is opt-in: uncomment when the target broker's certificate
  # does not chain to a public root, naming a Secret an operator manages out
  # of band with the CA bundle at caSecretKey. Never PEM content here.
  # caSecret: sre-ai-agent-kafka-ca

retention:
  enabled: true

networkPolicy:
  # Outbound HTTPS for model providers (e.g. api.openai.com).
  # Standard Kubernetes NetworkPolicy cannot match FQDNs. Production defines
  # 0.0.0.0/0 on port 443 as a pragmatic protocol/port compromise; operators
  # SHOULD narrow this to an egress gateway CIDR or provider-specific IP blocks
  # when their CNI supports stable egress IPs or FQDN policies.
  providerCidrs:
    - "0.0.0.0/0"
